# Redis for Arena + CTFd.
# CTFd keeps LOGIN SESSIONS here (plus cache, rate-limit counters, Arena's
# short locks and bounded activity buffer). Persistence is ON so a Redis
# restart does not log every player out. Redis is still not backed up by
# backup.sh: after a full restore players simply log in again.
# While Redis is DOWN, native CTFd cannot open sessions and answers 500 for
# most pages; Arena's own Redis use (locks, buffers, scoreboard cache) fails
# over to the database. Keep Redis on the same host, with restart policy.
bind 0.0.0.0
protected-mode yes
appendonly yes
appendfsync everysec
save ""
dir /data
# Sessions live here, so size memory generously; LRU eviction would log out
# the least recently active users first instead of failing writes.
maxmemory 512mb
maxmemory-policy allkeys-lru
rename-command CONFIG ""
rename-command DEBUG ""
