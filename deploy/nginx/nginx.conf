user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 4096; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  # Access log without query strings (tokens/codes can appear in them).
  log_format arena '$remote_addr - [$time_iso8601] "$request_method $uri" $status '
                   '$body_bytes_sent rt=$request_time urt=$upstream_response_time';
  access_log /dev/stdout arena;
  include /etc/nginx/conf.d/*.conf;
}
